<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #6366f1;
      border-b: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>✨ ApplyPilot AI Assistant</span>
  </div>
  <div class="status">
    Human-In-The-Loop Safety Active. Connected to ApplyPilot Engine.
  </div>
  <button id="autofill-btn">⚡ Auto-Fill Current Form</button>
  <script src="popup.js"></script>
</body>
</html>
